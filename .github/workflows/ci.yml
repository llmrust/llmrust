name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR or branch only (not across different PRs).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          # Pin the stable compiler so CI does not float with latest stable day-to-day.
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build (default features)
        run: cargo build --all-targets
      - name: Build (all features)
        run: cargo build --all-targets --all-features
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
      - name: Format
        run: cargo fmt --check
      - name: Publish dry-run
        run: cargo publish --dry-run

  semver-freeze:
    name: API-002 semver gate (vs 0.1.2 baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-semver-checks (pinned)
        run: cargo install cargo-semver-checks --version 0.48.0 --locked
      - name: Fetch 0.1.2 baseline source
        # 0.1.2 was published to crates.io and later yanked, so a registry
        # `--baseline-version 0.1.2` lookup is rejected ("version 0.1.2 is
        # yanked"). The published .crate artifact is still served by
        # static.crates.io, so we download it and use it as the baseline via
        # `--baseline-root`. This is the exact 0.1.2 public API that downstream
        # installed — the faithful "vs 0.1.2" gate the API-002 execution order
        # requires.
        run: |
          curl -fsSL https://static.crates.io/crates/llmrust/llmrust-0.1.2.crate -o /tmp/llmrust-0.1.2.crate
          mkdir -p /tmp/llmrust-0.1.2
          tar xzf /tmp/llmrust-0.1.2.crate -C /tmp/llmrust-0.1.2
      - name: Run semver gate against 0.1.2 baseline
        # Tracks the consumer-facing public API (default features). The proxy
        # DTO module is feature-gated and therefore not compiled here, which is
        # the mechanism that realizes the UNSTABLE proxy exemption (D6) without
        # weakening the gate for STABLE types.
        run: cargo semver-checks check-release --baseline-root /tmp/llmrust-0.1.2/llmrust-0.1.2

  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.86.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check (MSRV)
        run: cargo check --all-targets

  architecture:
    name: Architecture & package guards (CI-003)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          # Pin the stable compiler so CI does not float with latest stable day-to-day.
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Dependency-edge + hotspot guards
        run: cargo test --test architecture_guard
      - name: Package allowlist guard
        run: cargo test --test package_guard
