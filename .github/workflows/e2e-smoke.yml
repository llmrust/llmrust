name: E2E Smoke (manual + weekly)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

# Manual/triggered runs only. Never attach to pull_request or push: fork PRs
# must not enter the secret context (SPCC §11.7 E2E-001 允许范围 — 不进入普通
# fork PR secret 上下文). A fork of this repo has no workflow_dispatch button
# and no schedule that belongs to the fork, so its secrets stay empty.
concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: Provider smoke matrix (real upstream, low budget)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          # Pin the stable compiler so CI does not float with latest stable day-to-day.
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run provider smoke matrix
        env:
          LLMRUST_E2E: '1'
          # Each provider is configured from its own secret. Unset secrets are
          # empty strings at runtime — the harness prints `skipped` and exits 0
          # (skip is not fail). The Owner configures these in the repository
          # settings before the first real run (see docs/E2E-SMOKE.md).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: cargo run --example e2e_smoke
