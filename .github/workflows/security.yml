# Security Gates — CI-002 (Issue #88 / SPCC §9.1)
# Hard-fail gates for secrets, known vulnerabilities, banned licenses & sources.
# Triggers on PRs and pushes to main and the task branch so negatives can be
# validated before the implementation PR is opened for review.
name: Security Gates

on:
  push:
    branches: [main, "task/CI-002-security-gates"]
  pull_request:
    branches: [main]

# Minimal permissions: read-only code, plus checks:write so rustsec/audit-check
# can publish its advisory result as a check run. No secret/write access to fork PRs.
permissions:
  contents: read
  checks: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rustsec:
    name: RustSec advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo audit (RUSTSEC advisories)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Supply-chain policy (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # cargo-deny 0.20.x `check` accepts a single subcommand, so run them separately.
      - name: cargo deny — licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: licenses
      - name: cargo deny — bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: bans
      - name: cargo deny — sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: sources

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: gitleaks detect
        # Pinned to v2: v3 requires a paid GITLEAKS_LICENSE secret (unacceptable
        # for a secret-scanning gate) and dropped the config-path/args inputs.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        with:
          # Custom config (default rules + repo allowlist), see .gitleaks.toml.
          config-path: .gitleaks.toml
          # Scan the working tree only (no git history) so reverted fixtures stay
          # green; --redact desensitizes any leaked value in CI logs (SPCC §9.1).
          args: --no-git --redact
