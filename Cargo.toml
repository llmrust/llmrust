[package]
name = "llmrust"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Unified Rust interface for 7 LLM providers (OpenAI, Anthropic, DeepSeek, Google Gemini, Ollama, Moonshot, OpenRouter) with HTTP proxy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/llmrust/llmrust"
readme = "README.md"
keywords = ["llm", "openai", "anthropic", "ai", "chatgpt", "litellm", "claude", "gemini"]
categories = ["api-bindings", "asynchronous", "web-programming::http-server"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "proxy_server"
path = "examples/proxy_server.rs"
